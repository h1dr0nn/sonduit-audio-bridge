# Version values are DERIVED. Do not edit them by hand.
#
# The single source of truth is [workspace.package] version in the root
# Cargo.toml. Run `node tools/version.mjs sync` to regenerate these, and
# `node tools/version.mjs check` to verify they have not drifted. CI runs the
# check and fails on drift. See docs/adr/ADR-008-versioning.md.
sonduitVersionName=1.2.76
sonduitVersionCode=10276999

# Minimum API level is 27: Android 8.1 is where AAudio MMAP and exclusive mode
# became real. See docs/adr/ADR-003-android-playback.md.
sonduitMinSdk=27
sonduitTargetSdk=35

org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
android.useAndroidX=true
