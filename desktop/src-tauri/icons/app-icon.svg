<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93A9F2"/>
      <stop offset="1" stop-color="#5A6FD4"/>
    </linearGradient>
  </defs>

  <!-- Squircle field. Radius 118 on 512 approximates the platform mask on both
       Windows and Android, so the mark is never clipped by either. -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- A conduit: signal on the left, signal on the right, one link between.
       Four bars rising to the centre read as audio passing through, and stay
       legible at 32px where a literal speaker or waveform would turn to mush.
       The mark spans 55% of the tile so it carries at small sizes. -->
  <g fill="#FFFFFF">
    <rect x="112" y="204" width="42" height="104" rx="21"/>
    <rect x="186" y="150" width="42" height="212" rx="21"/>
    <rect x="284" y="150" width="42" height="212" rx="21"/>
    <rect x="358" y="204" width="42" height="104" rx="21"/>
  </g>

  <!-- The link itself, held back so the bars stay the primary read. -->
  <rect x="222" y="235" width="68" height="42" rx="21" fill="#FFFFFF" opacity="0.5"/>
</svg>
