[package]
name = "sonduit-desktop"
description = "Sonduit desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "sonduit_desktop"
path = "src/lib.rs"

[[bin]]
name = "sonduit"
path = "src/main.rs"

[dependencies]
sonduit-core.workspace = true
sonduit-transport.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tauri = { version = "2", features = [] }
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2.4.1"
tauri-plugin-log = "2.7.1"
tauri-plugin-process = "2.3.1"

# Capture is Windows-only, so the dependency is too: the workspace still has to
# build on the Linux runner that checks the core and the Android targets.
[target.'cfg(windows)'.dependencies]
sonduit-capture-win.workspace = true

[features]
# Used for production builds, or when devPath points at the filesystem.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
