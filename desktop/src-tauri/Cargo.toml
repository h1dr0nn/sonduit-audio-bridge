[package]
name = "sonduit-desktop"
description = "Sonduit - Audio Bridge, a low latency system audio bridge from Windows to Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "sonduit_desktop"
path = "src/lib.rs"

[[bin]]
name = "sonduit"
path = "src/main.rs"

# Hardware verification drivers. They exercise the product path headlessly,
# which is how the key-agreement defect was found and how the recovery and
# reachability fixes were shown to work on a real phone. Behind a feature so
# an ordinary `cargo build --workspace` does not carry five extra binaries.
#
# They are bins rather than examples because tauri-build emits its link
# arguments with `cargo:rustc-link-arg-bins`, which never reaches an example
# target: an example that builds a Tauri app links, then dies at load with
# 0xC0000139 before main runs.

[[bin]]
name = "verify_follow"
path = "src/bin/verify_follow.rs"
required-features = ["verify"]

[[bin]]
name = "verify_wifi_depth"
path = "src/bin/verify_wifi_depth.rs"
required-features = ["verify"]

[[bin]]
name = "verify_reach"
path = "src/bin/verify_reach.rs"
required-features = ["verify"]

[[bin]]
name = "verify_recover"
path = "src/bin/verify_recover.rs"
required-features = ["verify"]

[[bin]]
name = "verify_seal"
path = "src/bin/verify_seal.rs"
required-features = ["verify"]

[[bin]]
name = "verify_session"
path = "src/bin/verify_session.rs"
required-features = ["verify"]

[dependencies]
sonduit-core.workspace = true
sonduit-transport.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tauri = { version = "2", features = [] }
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2.4.1"
tauri-plugin-log = "2.7.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

# Capture is Windows-only, so the dependency is too: the workspace still has to
# build on the Linux runner that checks the core and the Android targets.
[target.'cfg(windows)'.dependencies]
sonduit-capture-win.workspace = true

# Enumerating network adapters, to find a tethered phone without asking the
# user for its address.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[features]
# Used for production builds, or when devPath points at the filesystem.
custom-protocol = ["tauri/custom-protocol"]
# The hardware verification drivers above. Not built by default.
verify = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
