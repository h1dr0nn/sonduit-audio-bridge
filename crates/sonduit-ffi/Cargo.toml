[package]
name = "sonduit-ffi"
description = "UniFFI bindings exposing sonduit-core to the Android app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
name = "sonduit_ffi"

[dependencies]
sonduit-core.workspace = true
sonduit-transport.workspace = true
sonduit-playback-android.workspace = true
thiserror.workspace = true

# Proc-macro bindings rather than a UDL file: one definition of the interface
# instead of two that can disagree, and the compiler checks it.
uniffi = { version = "0.29", features = ["cli"] }

# Logging, Android only. A receiver that fails on a device with nothing in
# logcat cannot be diagnosed at all: the first real session on hardware showed
# a buffer filling to its ceiling with no clue why, and there was nothing to
# read.
[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
android_logger = { version = "0.14", default-features = false }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[[bin]]
# Generates the Kotlin bindings. Invoked by the Gradle build.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[lints]
workspace = true
