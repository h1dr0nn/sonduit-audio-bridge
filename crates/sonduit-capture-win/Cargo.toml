[package]
name = "sonduit-capture-win"
description = "Windows system audio capture for Sonduit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sonduit-core.workspace = true
thiserror.workspace = true

# WASAPI lives behind a target gate so the workspace still builds on the Linux
# CI runner that compiles the shared core and the Android targets.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
] }

[lints]
workspace = true
