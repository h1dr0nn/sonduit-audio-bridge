name: release

# A tag, and nothing else. There is no release branch and no release pull
# request: pushing `release-v2.0.0` is the whole ceremony. The version in
# Cargo.toml is bumped in an ordinary commit beforehand, and the check below
# refuses the tag if the two disagree.
on:
  push:
    tags: ['release-v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: generate changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.build.outputs.changelog }}
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: classify
        name: Decide whether this release gets a changelog
        run: |
          set -e
          version="${GITHUB_REF_NAME#release-v}"
          previous=$(git describe --tags --abbrev=0 --match 'release-v[0-9]*.[0-9]*.[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")

          if [ -z "$previous" ]; then
            kind=minor
            echo "first release; treating as minor"
          else
            old="${previous#release-v}"
            IFS=. read -r om onm _ <<EOF
          $old
          EOF
            IFS=. read -r nm nnm _ <<EOF
          $version
          EOF
            if [ "$nm" != "$om" ]; then kind=major
            elif [ "$nnm" != "$onm" ]; then kind=minor
            else kind=patch
            fi
          fi

          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Release $version is a $kind release (previous: ${previous:-none})" >> "$GITHUB_STEP_SUMMARY"

      # Every commit in the range must be a valid Conventional Commit, or the
      # changelog would be wrong and a wrong changelog is worse than a failed
      # build.
      - name: Validate the commit range
        run: |
          set -e
          previous="${{ steps.classify.outputs.previous }}"
          if [ -z "$previous" ]; then
            range="${{ github.sha }}"
            echo "first release; validating from the first Sonduit commit"
            first=$(git log --format=%H --reverse --grep='^chore: remove harmonix python backend' | head -1)
            if [ -n "$first" ]; then range="${first}~1..${GITHUB_REF_NAME}"; fi
          else
            range="${previous}..${GITHUB_REF_NAME}"
          fi
          echo "validating $range"
          node tools/lint/check-commits.mjs "$range"

      - name: Install git-cliff
        if: steps.classify.outputs.kind != 'patch'
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - id: build
        name: Build the changelog
        run: |
          set -e
          kind="${{ steps.classify.outputs.kind }}"

          if [ "$kind" = "patch" ]; then
            # Deliberate: changelogs are written for minor and major releases
            # only. A patch release is fixes and chores, and its release notes
            # are the commit list. See ADR-008.
            echo "::notice::patch release; skipping changelog generation"
            {
              echo 'changelog<<CHANGELOG_EOF'
              echo "Patch release. See the commit history for the full list of fixes."
              echo 'CHANGELOG_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous="${{ steps.classify.outputs.previous }}"
          # Boundary: git-cliff must never walk into Harmonix history, which is
          # not Conventional Commits. See the note at the top of cliff.toml.
          if [ -z "$previous" ]; then
            range="harmonix-final..${GITHUB_REF_NAME}"
          else
            range="${previous}..${GITHUB_REF_NAME}"
          fi
          echo "generating changelog for $range"
          git cliff --config tools/cliff.toml "$range" --strip header --output generated.md

          if [ ! -s generated.md ]; then
            echo "::error::git-cliff produced an empty changelog for a $kind release"
            exit 1
          fi

          cat generated.md
          {
            echo 'changelog<<CHANGELOG_EOF'
            cat generated.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate the full CHANGELOG.md
        if: steps.classify.outputs.kind != 'patch'
        run: git cliff --config tools/cliff.toml "harmonix-final..$GITHUB_REF_NAME" --output CHANGELOG.md

      - uses: actions/upload-artifact@v4
        if: steps.classify.outputs.kind != 'patch'
        with:
          name: changelog
          path: CHANGELOG.md

  windows:
    name: windows release artifact
    needs: changelog
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify the tag matches the workspace version
        shell: bash
        run: |
          set -e
          declared=$(node tools/version.mjs read)
          tagged="${GITHUB_REF_NAME#release-v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $declared"
            exit 1
          fi
          node tools/version.mjs check

      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop

      - name: Fetch FFmpeg
        run: node tools/fetch-ffmpeg.mjs
        shell: bash

      # MIT and Apache-2.0 oblige the notice to travel with the binary, and the
      # notice is a function of Cargo.lock, so it is produced here for the same
      # reason FFmpeg is fetched here rather than committed.
      # `--features cli` is not optional: without it cargo-about installs no
      # binary and says so only in a warning.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version "^0.9"
        shell: bash

      - name: Generate the third-party licence notice
        run: node tools/gen-licences.mjs
        shell: bash

      - name: Build release bundles
        run: npx tauri build --ci
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: android release artifact
    needs: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Install NDK and cargo-ndk
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          cargo install cargo-ndk --locked

      - name: Build the shared core for every ABI
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          # --platform is not optional: the API 21 sysroot has no libaaudio.so.
          cargo ndk --platform 27 -t arm64-v8a -t armeabi-v7a -t x86_64 \
            build -p sonduit-ffi --release

      # Release signing needs a keystore this repository does not have, so the
      # APK this produces is unsigned and cannot be installed as-is. That is
      # deliberate: an artifact signed with a throwaway debug key looks
      # installable and locks the application id to a key nobody controls.
      # See docs/roadmap.md.
      - name: Build the release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PrustRelease

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            target/*-linux-android*/release/libsonduit_ffi.so
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error

  publish:
    name: publish github release
    needs: [changelog, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Named for the person downloading them, not for the tool that built
      # them. Tauri emits "Sonduit_2.0.0_x64_en-US.msi" and Gradle emits
      # "app-release-unsigned.apk"; neither says what it is once it is sitting
      # in a downloads folder beside six other files.
      #
      # product_platform_version_arch.ext, which is the scheme Harmonix used
      # and the one the release notes below describe.
      - name: Name the artifacts for humans
        run: |
          set -e
          version="${GITHUB_REF_NAME#release-v}"
          mkdir -p upload
          find artifacts -type f -print

          take() {
            found=$(find artifacts -type f -name "$1" | head -n 1)
            if [ -z "$found" ]; then
              echo "::error::no artifact matched $1"
              exit 1
            fi
            cp "$found" "upload/$2"
            echo "named $2"
          }

          take '*.msi' "sonduit_windows_${version}_x86_64.msi"
          take '*-setup.exe' "sonduit_windows_${version}_x86_64.exe"
          # One APK carries every ABI: see releaseAbis in
          # android/app/build.gradle.kts. There is no per-ABI split to name.
          take '*.apk' "sonduit_android_${version}_universal.apk"

          # A checksum per file, because these are unsigned and a checksum is
          # the only thing a person can check them against.
          ( cd upload && sha256sum * > "sonduit_${version}_SHA256SUMS.txt" )
          ls -l upload

      - name: Compose the release notes
        run: |
          set -e
          version="${GITHUB_REF_NAME#release-v}"
          repo="${{ github.repository }}"

          cat > changelog.md <<'CHANGELOG_EOF'
          ${{ needs.changelog.outputs.changelog }}
          CHANGELOG_EOF

          {
            echo "# Sonduit v${version}"
            echo ""
            echo "**Repository:** [${repo}](https://github.com/${repo})  "
            echo "**Release Type:** Stable"
            echo ""
            echo "---"
            echo ""
            echo "## Changelog"
            echo ""
            if [ "${{ needs.changelog.outputs.kind }}" = "patch" ]; then
              echo "Patch release. See the [commit history](https://github.com/${repo}/commits/${GITHUB_REF_NAME}) for what changed."
            else
              cat changelog.md
            fi
            echo ""
            echo "---"
            echo ""
            echo "## Download Options"
            echo ""
            echo "### Windows"
            echo "- **MSI Installer:** \`sonduit_windows_${version}_x86_64.msi\` (enterprise)"
            echo "- **NSIS Installer:** \`sonduit_windows_${version}_x86_64.exe\` (standard)"
            echo ""
            echo "### Android"
            echo "- **APK:** \`sonduit_android_${version}_universal.apk\` (arm64-v8a, armeabi-v7a, x86_64)"
            echo ""
            echo "The APK is **unsigned**, and Android will refuse to install it as it stands."
            echo "Sonduit has no release keystore yet, and shipping one signed with a throwaway"
            echo "key would lock \`net.sonduit.app\` to a key nobody controls."
            echo ""
            echo "Checksums for every file are in \`sonduit_${version}_SHA256SUMS.txt\`."
            echo ""
            echo "---"
            echo ""
            echo "## System Requirements"
            echo "- **Windows:** 10 or later (64-bit)  "
            echo "- **Android:** 8.1 (API 27) or later  "
            echo "- **Link:** both devices on the same Wi-Fi, or the phone tethered over USB"
            echo ""
            echo "---"
            echo ""
            echo "## Documentation"
            echo "- [Repository](https://github.com/${repo})  "
            echo "- [Open an Issue](https://github.com/${repo}/issues)"
            echo ""
            echo "---"
            echo ""
            echo "## License"
            echo "MIT License -- free for personal and commercial use."
            echo "Third-party notices are installed beside the application."
          } > notes.md

          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME" \
            --title "Sonduit v${GITHUB_REF_NAME#release-v}" \
            --notes-file notes.md \
            upload/*
