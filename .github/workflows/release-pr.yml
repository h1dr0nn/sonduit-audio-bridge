name: release-pr

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    name: open or update the release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: version
        name: Compute the next release version
        run: |
          set -e
          last=$(node tools/version.mjs last-release)
          range=$(node tools/version.mjs range)

          current=$(node tools/version.mjs read)
          next=$(node tools/version.mjs next "$range")

          if [ "$current" = "$next" ]; then
            echo "::notice::no releasable commits since $last"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Classify so the body can say whether a changelog will be produced.
          IFS=. read -r cm cn _ <<EOF
          $current
          EOF
          IFS=. read -r nm nn _ <<EOF
          $next
          EOF
          if [ "$nm" != "$cm" ]; then kind=major
          elif [ "$nn" != "$cn" ]; then kind=minor
          else kind=patch
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        if: steps.version.outputs.skip == 'false' && steps.version.outputs.kind != 'patch'
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Apply the version bump
        if: steps.version.outputs.skip == 'false'
        run: |
          set -e
          next="${{ steps.version.outputs.next }}"

          # Cargo.toml is the single source; everything else is derived.
          sed -i -E "0,/^version = \"[0-9.]+\"$/s//version = \"$next\"/" Cargo.toml
          node tools/version.mjs sync "$next"
          node tools/version.mjs check
          cargo update --workspace --offline 2>/dev/null || true

          if [ "${{ steps.version.outputs.kind }}" != "patch" ]; then
            # Boundary: never walk past harmonix-final. See cliff.toml.
            git cliff harmonix-final..HEAD --tag "v$next" --output CHANGELOG.md
          fi

      - id: body
        name: Compose the pull request body
        if: steps.version.outputs.skip == 'false'
        run: |
          set -e
          next="${{ steps.version.outputs.next }}"
          kind="${{ steps.version.outputs.kind }}"
          last="${{ steps.version.outputs.last }}"
          code=$(node tools/version.mjs code "$next")

          {
            echo "Merging this pull request is the only manual step in a release."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$next\` (was \`${{ steps.version.outputs.current }}\`) |"
            echo "| Bump | $kind |"
            echo "| Android versionCode | \`$code\` |"
            echo "| Previous release | ${last:-none} |"
            echo ""
            if [ "$kind" = "patch" ]; then
              echo "This is a **patch** release, so no changelog is generated."
              echo "Release notes will point at the commit history. See ADR-008."
            else
              echo "### Changelog"
              echo ""
              git cliff harmonix-final..HEAD --tag "v$next" --strip header 2>/dev/null || echo "_none_"
            fi
            echo ""
            echo "---"
            echo ""
            echo "After merging, tag \`v$next\` on \`main\` to trigger the release workflow."
          } > pr-body.md

          cat pr-body.md

      - name: Open or update the pull request
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          next="${{ steps.version.outputs.next }}"
          branch="release/v$next"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::nothing to commit"
            exit 0
          fi
          git commit -m "chore(ci): release v$next"
          git push -f origin "$branch"

          existing=$(gh pr list --head "$branch" --base main --json number --jq '.[0].number' || echo "")
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Release v$next" --body-file pr-body.md
            echo "updated PR #$existing"
          else
            gh pr create --base main --head "$branch" \
              --title "Release v$next" --body-file pr-body.md
          fi
