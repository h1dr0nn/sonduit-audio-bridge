name: ci

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  language:
    name: language rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Commit linting needs the range, not just the tip.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Source is ASCII outside // comment bodies
        run: node tools/lint/check-source-ascii.mjs

      - name: Commit subjects are ASCII and Conventional Commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          else
            # github.event.before is the null SHA when a branch is created and
            # an unreachable object after a force-push, so it cannot be trusted
            # as a range endpoint. Fall back to the last Sonduit release.
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]                || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              range="$(node tools/version.mjs range)"
              echo "::notice::event.before unusable; checking $range instead"
            else
              range="${before}..HEAD"
            fi
          fi
          echo "checking $range"
          node tools/lint/check-commits.mjs "$range"

      - name: Version tooling tests
        run: node --test tools/version.test.mjs

      - name: Version lives in exactly one place
        run: node tools/version.mjs check

  core:
    name: core (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # sonduit-desktop is excluded here and covered by the windows job. It is
      # a Tauri application, so on Linux it drags in GTK, glib and webkit
      # development headers that this runner does not have and that nothing
      # about the shared code needs.
      - run: cargo clippy --workspace --exclude sonduit-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude sonduit-desktop

      # The structural rule from ADR-001, enforced rather than trusted:
      # sonduit-core must build with no platform crates in its tree.
      - name: sonduit-core has no platform dependencies
        run: |
          set -e
          tree=$(cargo tree -p sonduit-core --edges normal --prefix none | sort -u)
          echo "$tree"
          for forbidden in windows windows-sys ndk oboe jni tokio winapi core-foundation; do
            if echo "$tree" | grep -qE "^${forbidden} v"; then
              echo "::error::sonduit-core depends on ${forbidden}; see ADR-001"
              exit 1
            fi
          done
          echo "OK: sonduit-core is platform independent"

  licences:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans

  desktop:
    name: desktop (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      - name: Build frontend
        run: npm run build
        working-directory: desktop

      # The editor shells out to FFmpeg. It is gitignored and fetched here so a
      # 110 MB binary never enters git history.
      - name: Fetch FFmpeg
        run: node tools/fetch-ffmpeg.mjs

      # This is the only feedback loop for the WASAPI half of the project, so
      # it runs on every pull request rather than only on release.
      - name: Build desktop binary
        run: cargo build -p sonduit-desktop --features custom-protocol

      - name: Test the windows capture crate
        run: cargo test -p sonduit-capture-win

  android:
    name: android (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The Rust is checked for every ABI even though only one is needed to
      # build a debug APK: a linker error on armeabi-v7a is worth catching here
      # rather than at release time.
      - name: Cross-compile the shared core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          # --platform is not optional. Without it cargo-ndk links against the
          # API 21 sysroot, where libaaudio.so does not exist yet, and the
          # build fails with an unfindable -laaudio.
          cargo ndk --platform 27 -t arm64-v8a -t armeabi-v7a -t x86_64 \
            build -p sonduit-ffi -p sonduit-playback-android --release

      # Gradle drives cargo-ndk itself and generates the UniFFI bindings from
      # the library it built, so this is the step that proves the Kotlin and
      # the Rust agree on the interface.
      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonduit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
