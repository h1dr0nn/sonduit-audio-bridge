name: develop

# Work happens on main, so the test build is cut from main. The tag it
# publishes under is still `develop-build`: it names what the build is for,
# not the branch it came from.
on:
  push:
    branches: [main]

concurrency:
  group: develop
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: compute dev version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      code: ${{ steps.compute.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: compute
        name: Derive the version from the commits since the last release
        run: |
          set -e
          # version.mjs excludes the Harmonix tags by reachability from
          # harmonix-final; a plain git describe would pick up v1.0.4 and
          # compute the next release as 1.1.0. See ADR-008.
          range=$(node tools/version.mjs range)
          echo "range: $range"

          # The counter is derived from commits since the last release, not
          # from the run number: a run number grows without bound and would
          # eventually hit the reserved release slot. See ADR-008.
          version=$(node tools/version.mjs dev "$range")
          code=$(node tools/version.mjs code "$version")

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "### Develop build \`$version\` (versionCode $code)" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: windows debug artifact
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Stamp the version
        run: node tools/version.mjs sync "${{ needs.version.outputs.version }}"

      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop

      - name: Fetch FFmpeg
        run: node tools/fetch-ffmpeg.mjs
        shell: bash

      # MIT and Apache-2.0 oblige the notice to travel with the binary, and the
      # notice is a function of Cargo.lock, so it is produced here for the same
      # reason FFmpeg is fetched here rather than committed.
      # `--features cli` is not optional: without it cargo-about installs no
      # binary and says so only in a warning.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version "^0.9"
        shell: bash

      - name: Generate the third-party licence notice
        run: node tools/gen-licences.mjs
        shell: bash

      - name: Build unsigned desktop binary
        run: cargo build -p sonduit-desktop --features custom-protocol

      # The executable alone is not something a tester can run: it spawns
      # ffmpeg from beside itself, and the licence notices have to travel with
      # the binary anyway. Staged together here so the published file is a
      # folder that works rather than one file that half does.
      #
      # No installer on develop. The develop version carries a prerelease and a
      # build suffix -- 2.0.0-dev.38+bd4b3acd -- and MSI version fields are
      # four numbers and nothing else, so bundling would fail on the version
      # before it failed on anything real.
      - name: Stage the portable build
        shell: bash
        run: |
          set -e
          mkdir -p portable
          cp target/debug/sonduit.exe portable/
          cp desktop/src-tauri/binaries/ffmpeg.exe portable/
          cp desktop/src-tauri/binaries/*.txt portable/
          ls -l portable

      - uses: actions/upload-artifact@v4
        with:
          name: sonduit-windows-${{ needs.version.outputs.version }}
          path: portable/
          retention-days: 14
          if-no-files-found: error

  android:
    name: android debug artifact
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Stamp the version
        run: node tools/version.mjs sync "${{ needs.version.outputs.version }}"

      - name: Install NDK and cargo-ndk
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          cargo install cargo-ndk --locked

      - name: Cross-compile the shared core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        # --platform is not optional: the API 21 sysroot has no libaaudio.so.
        run: cargo ndk --platform 27 -t arm64-v8a build -p sonduit-ffi --release

      # Gradle drives cargo-ndk itself and generates the UniFFI bindings from
      # the library it built, so this step is also what proves the Kotlin and
      # the Rust still agree on the interface.
      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sonduit-android-${{ needs.version.outputs.version }}
          path: |
            target/aarch64-linux-android/release/libsonduit_ffi.so
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  prerelease:
    name: publish rolling prerelease
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The tag is `develop-build`, not `develop`. A tag sharing a name with a
      # branch makes every unqualified reference to it ambiguous, and git
      # refuses the push outright: "src refspec develop matches more than one".
      # The refspecs below are fully qualified anyway, so neither mistake can
      # come back.
      - name: Move the rolling develop tag
        run: |
          git tag -f develop-build
          git push -f origin refs/tags/develop-build

          # A `develop` tag from before the develop branch existed would keep
          # the ambiguity alive for anyone who fetched it.
          git push --delete origin refs/tags/develop 2>/dev/null || true

      # No changelog here on purpose. Changelogs are generated for minor and
      # major releases only; a per-push develop build has nothing worth
      # summarising and would only create noise. See ADR-008.
      # The same naming as a real release, so a tester downloading both does
      # not have to work out which file is which. The version carries the
      # develop build number, so two develop builds never share a name.
      - name: Name the artifacts for humans
        run: |
          set -e
          version="${{ needs.version.outputs.version }}"
          mkdir -p upload
          find artifacts -type f -print

          # Strict. A rename rule that silently matches nothing drops the
          # artifact from the release and says so nowhere, which is how a
          # develop build could ship with no Windows download at all.
          need() {
            found=$(find artifacts -type f -name "$1" | head -n 1)
            if [ -z "$found" ]; then
              echo "::error::no artifact matched $1"
              exit 1
            fi
            echo "$found"
          }

          exe=$(need 'sonduit.exe')
          zip="upload/sonduit_windows_${version}_x86_64_portable.zip"
          ( cd "$(dirname "$exe")" && zip -qr - . ) > "$zip"
          echo "named sonduit_windows_${version}_x86_64_portable.zip"

          cp "$(need '*.apk')" "upload/sonduit_android_${version}_universal.apk"
          echo "named sonduit_android_${version}_universal.apk"
          ( cd upload && sha256sum * > "sonduit_${version}_SHA256SUMS.txt" )
          ls -l upload

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version="${{ needs.version.outputs.version }}"

          {
            echo "# Sonduit v${version}"
            echo ""
            echo "**Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})  "
            echo "**Release Type:** Development"
            echo ""
            echo "---"
            echo ""
            echo "Built from \`${{ github.sha }}\`. Debug artifacts, unsigned, for testing only."
            echo "The \`develop-build\` tag is rolling: every push to develop overwrites it."
            echo ""
            echo "No changelog is generated for develop builds. See ADR-008."
            echo ""
            echo "---"
            echo ""
            echo "## Download Options"
            echo ""
            echo "### Windows"
            echo "- **Portable ZIP:** \`sonduit_windows_${version}_x86_64_portable.zip\` (no install; unzip and run)"
            echo ""
            echo "### Android"
            echo "- **APK:** \`sonduit_android_${version}_universal.apk\`"
            echo ""
            echo "Checksums are in \`sonduit_${version}_SHA256SUMS.txt\`."
          } > notes.md

          gh release delete develop-build --yes --cleanup-tag=false 2>/dev/null || true
          gh release create develop-build \
            --prerelease \
            --title "develop ($version)" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            upload/*
