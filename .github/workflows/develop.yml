name: develop

# A tag, and nothing else, exactly like a release. Pushing `develop-v1.1.0`
# cuts a test build; pushing nothing cuts nothing. Work on main does not
# trigger this, because most commits are not something anyone wants to install.
#
# The published tag stays `develop-build` and stays rolling: it names what the
# build is for, and there is only ever one current test build.
on:
  push:
    tags: ['develop-v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: develop
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: check the tag and the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      code: ${{ steps.compute.outputs.code }}
      label: ${{ steps.compute.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: compute
        name: Check the tag against the version in the tree
        run: |
          set -e
          # The tag says which version this is a test build of, so it must
          # agree with the file the version is derived from. A tag that says
          # 1.2.0 against a 1.1.0 tree produces artifacts named for a version
          # this tree is not on.
          declared=$(node tools/version.mjs read)
          tagged="${GITHUB_REF_NAME#develop-v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $declared"
            exit 1
          fi

          # There is no separate develop version string any more: the third
          # component IS the build counter, so a develop build is the tree
          # version verbatim. See ADR-008.
          #
          # What stood here was a second check that the computed version had
          # the shape "$declared-dev.N". There is no such shape now, and the
          # check as written would compare "$declared" with itself and pass
          # always, which is worse than no check at all. This is the
          # belt-and-braces check worth having in its place: that every file
          # the artifacts are built from agrees with the tag, and not only the
          # one file the tag was compared against.
          node tools/version.mjs check

          version="$declared"

          # A develop build takes the bottom slot of its version's block, so
          # the release of the same a.b.c outranks it and installs over it.
          # The version string no longer says which kind of build this is --
          # the tag does -- and this flag is how the tag tells the tooling.
          code=$(node tools/version.mjs code "$version" --develop)

          # And the label is how it tells a human. Both kinds of build carry
          # the same version now, so without this a develop APK and a released
          # APK of 1.2.76 would be two different files with one name.
          label="${version}-dev"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "### Develop build $label (version $version, versionCode $code)" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: windows debug artifact
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Stamp the version
        run: node tools/version.mjs sync "${{ needs.version.outputs.version }}" --develop

      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop

      - name: Fetch FFmpeg
        run: node tools/fetch-ffmpeg.mjs
        shell: bash

      # MIT and Apache-2.0 oblige the notice to travel with the binary, and the
      # notice is a function of Cargo.lock, so it is produced here for the same
      # reason FFmpeg is fetched here rather than committed.
      # `--features cli` is not optional: without it cargo-about installs no
      # binary and says so only in a warning.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version "^0.9"
        shell: bash

      - name: Generate the third-party licence notice
        run: node tools/gen-licences.mjs
        shell: bash

      - name: Build unsigned desktop binary
        run: cargo build -p sonduit-desktop --features custom-protocol

      # The executable alone is not something a tester can run: it spawns
      # ffmpeg from beside itself, and the licence notices have to travel with
      # the binary anyway. Staged together here so the published file is a
      # folder that works rather than one file that half does.
      #
      # No installer on develop. The reason used to be mechanical -- the
      # develop version carried a prerelease and a build suffix,
      # 1.1.0-dev.54+e59ed654, and MSI version fields are four numbers and
      # nothing else, so bundling would have failed on the version before it
      # failed on anything real. That reason is gone: a develop version is now
      # a plain 1.2.76 an MSI would take. The remaining reason is the one that
      # mattered anyway -- this is an unsigned debug build, and an installer
      # invites somebody to install it as though it were a release.

      - name: Stage the portable build
        shell: bash
        run: |
          set -e
          mkdir -p portable
          cp target/debug/sonduit.exe portable/
          cp desktop/src-tauri/binaries/ffmpeg.exe portable/
          cp desktop/src-tauri/binaries/*.txt portable/
          ls -l portable

      - uses: actions/upload-artifact@v4
        with:
          name: sonduit-windows-${{ needs.version.outputs.label }}
          path: portable/
          retention-days: 14
          if-no-files-found: error

  android:
    name: android debug artifact
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Stamp the version
        run: node tools/version.mjs sync "${{ needs.version.outputs.version }}" --develop

      - name: Install NDK and cargo-ndk
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          cargo install cargo-ndk --locked

      - name: Cross-compile the shared core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        # --platform is not optional: the API 21 sysroot has no libaaudio.so.
        run: cargo ndk --platform 27 -t arm64-v8a build -p sonduit-ffi --release

      # Gradle drives cargo-ndk itself and generates the UniFFI bindings from
      # the library it built, so this step is also what proves the Kotlin and
      # the Rust still agree on the interface.
      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sonduit-android-${{ needs.version.outputs.label }}
          path: |
            target/aarch64-linux-android/release/libsonduit_ffi.so
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  prerelease:
    name: publish rolling prerelease
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The tag is `develop-build`, not `develop`. A tag sharing a name with a
      # branch makes every unqualified reference to it ambiguous, and git
      # refuses the push outright: "src refspec develop matches more than one".
      # The refspecs below are fully qualified anyway, so neither mistake can
      # come back.
      - name: Move the rolling develop tag
        run: |
          git tag -f develop-build
          git push -f origin refs/tags/develop-build

          # A `develop` tag from before the develop branch existed would keep
          # the ambiguity alive for anyone who fetched it.
          git push --delete origin refs/tags/develop 2>/dev/null || true

      # No changelog here on purpose. Changelogs are generated for minor and
      # major releases only; a develop build has nothing worth summarising and
      # would only create noise. See ADR-008.
      #
      # Nearly the same naming as a real release, so a tester downloading both
      # does not have to work out which file is which -- but not identical.
      # Since the build counter moved into the version itself there is no
      # `-dev.N` suffix to tell the two apart, and a develop build and a
      # release of 1.2.76 would otherwise produce two different files under one
      # name. The `-dev` label is that distinction, and the versionCode carries
      # it too: a develop build sits at the bottom of its version's block and
      # the release at the top. Two develop builds still never share a name,
      # because the counter moves with every commit.

      - name: Name the artifacts for humans
        run: |
          set -e
          version="${{ needs.version.outputs.version }}"
          label="${{ needs.version.outputs.label }}"
          mkdir -p upload
          find artifacts -type f -print

          # Strict. A rename rule that silently matches nothing drops the
          # artifact from the release and says so nowhere, which is how a
          # develop build could ship with no Windows download at all.
          need() {
            found=$(find artifacts -type f -name "$1" | head -n 1)
            if [ -z "$found" ]; then
              echo "::error::no artifact matched $1"
              exit 1
            fi
            echo "$found"
          }

          exe=$(need 'sonduit.exe')
          zip="upload/sonduit_windows_${label}_x86_64_portable.zip"
          ( cd "$(dirname "$exe")" && zip -qr - . ) > "$zip"
          echo "named sonduit_windows_${label}_x86_64_portable.zip"

          cp "$(need '*.apk')" "upload/sonduit_android_${label}_universal.apk"
          echo "named sonduit_android_${label}_universal.apk"
          ( cd upload && sha256sum * > "sonduit_${label}_SHA256SUMS.txt" )
          ls -l upload

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version="${{ needs.version.outputs.version }}"
          label="${{ needs.version.outputs.label }}"

          {
            echo "# Sonduit v${version}"
            echo ""
            echo "**Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})  "
            echo "**Release Type:** Development"
            echo ""
            echo "---"
            echo ""
            echo "Built from \`${{ github.sha }}\`. Debug artifacts, unsigned, for testing only."
            echo "The version is \`${version}\`; the files are labelled \`${label}\`, because a"
            echo "develop build and a release now carry the same version. See ADR-008."
            echo "The \`develop-build\` tag is rolling: every \`develop-v\` tag overwrites it."
            echo ""
            echo "No changelog is generated for develop builds. See ADR-008."
            echo ""
            echo "---"
            echo ""
            echo "## Download Options"
            echo ""
            echo "### Windows"
            echo "- **Portable ZIP:** \`sonduit_windows_${label}_x86_64_portable.zip\` (no install; unzip and run)"
            echo ""
            echo "### Android"
            echo "- **APK:** \`sonduit_android_${label}_universal.apk\`"
            echo ""
            echo "Checksums are in \`sonduit_${label}_SHA256SUMS.txt\`."
          } > notes.md

          gh release delete develop-build --yes --cleanup-tag=false 2>/dev/null || true
          gh release create develop-build \
            --prerelease \
            --title "develop ($version)" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            upload/*
