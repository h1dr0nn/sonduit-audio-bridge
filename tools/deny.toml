# cargo-deny configuration.
#
# The point of this file is stated in docs/licensing.md: sonduit-core compiles
# into BOTH the Windows binary and the Android app, so a copyleft dependency
# anywhere in its tree contaminates the whole product, not one half of it.
# Discipline is not a control; this is the control.

[graph]
all-features = true
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "x86_64-unknown-linux-gnu",
]

[licenses]
# Sonduit is MIT. Only permissive licences that can be redistributed inside an
# MIT-licensed binary are allowed here.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
]
# MPL-2.0 is on this list and is the one entry that is not plainly permissive.
# It is file-level copyleft: the obligation attaches to the MPL-licensed files
# themselves, and section 3.3 permits distributing a Larger Work under another
# licence provided those files stay under the MPL. Nothing here modifies them,
# so Sonduit stays MIT.
#
# It is also not removable. Fourteen crates in the tree resolve against it:
# uniffi and its eight companions, which are the entire Android binding layer,
# and cssparser, cssparser-macros, selectors, dtoa-short and option-ext, which
# arrive under tauri. None of them is in sonduit-core's tree, so the
# shared-core contamination this file exists to prevent does not arise. See
# docs/licensing.md section 4.2.
confidence-threshold = 0.9

# Everything not on the list above is denied, which is the intent: GPL-2.0,
# GPL-3.0, AGPL-3.0 and LGPL all fail here rather than in review. See the
# "Decisions that would force Sonduit to GPL" table in docs/licensing.md.

# Note: driver/ is empty today (see ADR-002). If a driver ever ships there it
# will be MS-PL and unmodified. It is not a Cargo dependency, so cargo-deny
# never sees it either way; its obligations live in docs/licensing.md.

[bans]
multiple-versions = "warn"
wildcards = "deny"

# sonduit-core must stay free of heavyweight platform crates; ADR-001 explains
# why. That rule is enforced properly by the cargo-tree check in ci.yml, which
# can see WHICH crate pulled a dependency in. A [bans] entry cannot express
# "not under sonduit-core" -- tokio legitimately arrives through tauri on the
# desktop side, and listing our own crates as wrappers only produced
# unused-wrapper warnings.
deny = []

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
